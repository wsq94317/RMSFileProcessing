<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RMS Import Builder</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
  <main class="page">
    <section class="panel">
      <div class="header">
        <div>
          <h1>RMS Import Builder</h1>
          <p>Upload the ASI, SiteMinder, and Expedia files to generate the RMS import master file.</p>
        </div>
      </div>

      <form method="post" action="{{ url_for('process_uploads') }}" enctype="multipart/form-data" class="form">
        <label class="upload-card">
          <span class="label">1. ASI Advance Guest Search</span>
          <span class="hint">Absolute master file. No rows from this file will be removed.</span>
          <span class="example">Example: 21860_AdvanceGuestSearch_20260507_203734.xls</span>
          <span class="file-row"><input type="file" name="master_file" accept=".xls,.html,.htm" required></span>
        </label>

        <label class="upload-card">
          <span class="label">2. ASI Batch Folio</span>
          <span class="hint">Primary active-booking filter from ASI.</span>
          <span class="example">Missing Folio No. rows are normally cancelled; SiteMinder-active conflicts stay active for review.</span>
          <span class="file-row"><input type="file" name="batch_folio_file" accept=".xls,.xlsx" required></span>
        </label>

        <label class="upload-card">
          <span class="label">3. ASI Guest Arrival Report</span>
          <span class="hint">Used to copy ASI Remark into the final Note column.</span>
          <span class="example">Guest name, check-in date, and check-out date must match exactly.</span>
          <span class="file-row"><input type="file" name="arrival_file" accept=".xls,.xlsx" required></span>
        </label>

        <label class="upload-card">
          <span class="label">4. Expedia Reservations List</span>
          <span class="hint">Expedia reservationsList.csv.</span>
          <span class="example">Used to set Expedia Payment Type by matching CRS Folio # to Reservation ID.</span>
          <span class="file-row"><input type="file" name="expedia_file" accept=".csv" required></span>
        </label>

        <label class="upload-card optional">
          <span class="label">5. SiteMinder Reservations Summary <em>Optional</em></span>
          <span class="hint">Used for source recovery and cross-check audit only.</span>
          <span class="example">Active/Cancel is controlled by ASI Batch Folio when Batch Folio is uploaded.</span>
          <span class="file-row"><input type="file" name="siteminder_files" accept=".csv" multiple></span>
        </label>

        <div class="actions">
          <button type="submit">Generate Files</button>
        </div>
      </form>
    </section>

    <section class="guide">
      <h2>Output Columns</h2>
      <div class="grid">
        <div><strong>Payment Type</strong><span>Prepaid / VCC / POA / blank</span></div>
        <div><strong>Note</strong><span>Copied from Arrival Report Remark after exact matching</span></div>
        <div><strong>Active/Cancel</strong><span>Controlled by ASI Batch Folio, with conflict review</span></div>
      </div>
    </section>
  </main>
</body>
</html>
