<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RMS Import Builder</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
  <main class="page">
    <section class="panel">
      <div class="header">
        <div>
          <h1>RMS Import Builder</h1>
          <p>上传 ASI、SiteMinder 和 Expedia 文件，生成 RMS 导入主表。</p>
        </div>
      </div>

      <form method="post" action="{{ url_for('process_uploads') }}" enctype="multipart/form-data" class="form">
        <label class="upload-card">
          <span class="label">1. ASI Advance Guest Search</span>
          <span class="hint">绝对主表，不删除任何行。示例：21860_AdvanceGuestSearch_20260507_203734.xls</span>
          <input type="file" name="master_file" accept=".xls,.html,.htm" required>
        </label>

        <label class="upload-card">
          <span class="label">2. ASI Guest Arrival Report</span>
          <span class="hint">用于复制 Remark 到最终表的 Note。姓名和 check-in/out 日期必须完全一致。</span>
          <input type="file" name="arrival_file" accept=".xls,.xlsx" required>
        </label>

        <label class="upload-card">
          <span class="label">3. SiteMinder Reservations Summary</span>
          <span class="hint">可上传一个或多个 CSV，用于判断 Active/Cancel。</span>
          <input type="file" name="siteminder_files" accept=".csv" multiple required>
        </label>

        <label class="upload-card">
          <span class="label">4. Expedia Reservations List</span>
          <span class="hint">reservationsList.csv，用 CRS Folio # 匹配 Reservation ID 来判断 Expedia Payment Type。</span>
          <input type="file" name="expedia_file" accept=".csv" required>
        </label>

        <button type="submit">生成文件</button>
      </form>
    </section>

    <section class="guide">
      <h2>输出列</h2>
      <div class="grid">
        <div><strong>Payment Type</strong><span>Prepaid / VCC / POA / 空白</span></div>
        <div><strong>Note</strong><span>从 Arrival Report 的 Remark 精确匹配复制</span></div>
        <div><strong>Active/Cancel</strong><span>从 SiteMinder 的 Booking status 判断</span></div>
      </div>
    </section>
  </main>
</body>
</html>
